name: CI/CD Pipeline for labelling

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 리포지토리 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. AWS CLI 설정 (AWS 자격 증명)
      - name: Set up AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ secrets.AWS_REGION }}

      # 3. Docker 이미지 빌드
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.AWS_ECR_URI }}/labelling:latest .

      # 4. ECR 로그인
      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_URI }}

      # 5. Docker 이미지 ECR에 푸시
      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.AWS_ECR_URI }}/labelling:latest

      # 6. EC2에 SSH로 접속하여 컨테이너 재시작
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
            # 기존 컨테이너 중지 및 삭제
            docker stop labelling-container || true
            docker rm labelling-container || true
            # ECR에서 최신 이미지 풀
            docker pull ${{ secrets.AWS_ECR_URI }}/labelling:latest
            # 새 컨테이너 실행
            docker run -d -p 8000:8000 --name labelling-container ${{ secrets.AWS_ECR_URI }}/labelling:latest
          EOF

      # 7. (선택 사항) EC2 서버 로그 출력 (디버깅 용도)
      - name: Fetch logs from EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_PUBLIC_IP }} "docker logs labelling-container"
