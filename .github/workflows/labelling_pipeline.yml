name: CI/CD Pipeline for labelling

on:
  push:
    branches:
      - labelling_pipeline

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ECR_REPOSITORY: ${{ secrets.AWS_ECR_URI }}
      EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up AWS CLI
        run: |
          aws configure set region $AWS_REGION

      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY/labelling:latest .

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REPOSITORY/labelling:latest

      - name: Add SSH key
        run: |
          echo "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$EC2_PUBLIC_IP << 'EOF'
            docker stop labelling-container || echo "No container to stop."
            docker rm labelling-container || echo "No container to remove."
            docker pull $ECR_REPOSITORY/labelling:latest
            docker run -d -p 8000:8000 --name labelling-container $ECR_REPOSITORY/labelling:latest
          EOF

      - name: Fetch logs from EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$EC2_PUBLIC_IP "docker logs labelling-container"
